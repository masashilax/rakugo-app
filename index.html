<body class="bg-[#f7f3e8] text-[#2c2c2c] select-none">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- ドラッグ＆ドロップの初期化 ---
        try {
            MobileDragDrop.polyfill({
                // スマホでスクロールとドラッグを区別するため、長押し(300ms)でドラッグ開始
                holdToDrag: 300,
                dragImageTranslateOverride: MobileDragDrop.scrollBehaviourDragImageTranslateOverride
            });
        } catch (e) { console.log('DnD polyfill error', e); }

        // --- Firebase ---
        const firebaseConfig = {
            apiKey: "AIzaSyDI4DD7UL9Pf3QVATYCzXD9eoffhIWQK2c",
            authDomain: "rakugo-c5c68.firebaseapp.com",
            projectId: "rakugo-c5c68",
            storageBucket: "rakugo-c5c68.firebasestorage.app",
            messagingSenderId: "175875332254",
            appId: "1:175875332254:web:3c9a65c00e337df11e838f",
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        db.settings({ ignoreUndefinedProperties: true, merge: true });
        // 電波がない場所でも記録できるように端末にキャッシュ（電波が戻ったら自動でクラウドへ）
        db.enablePersistence({ synchronizeTabs: true }).catch(e => console.log('persistence', e.code));
        try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

        // データの置き場所:
        //   users/{uid}/logs/{id}          記録
        //   users/{uid}/photos/{id}_{番号}  写真（1枚ずつ別に保存するので枚数の上限なし）
        //   users/{uid}/images/{id}        旧形式の写真（読み込みのみ対応・保存し直すと新形式へ）
        const logsCol = (uid) => db.collection('users').doc(uid).collection('logs');
        const photosCol = (uid) => db.collection('users').doc(uid).collection('photos');
        const imagesCol = (uid) => db.collection('users').doc(uid).collection('images');
        const photoId = (logId, i) => `${logId}_${i}`;
        const PHOTOS_PER_BATCH = 15; // 1回の送信が大きくなりすぎないように分ける

        const imagesOf = (log) => {
            if (log.images && Array.isArray(log.images)) return log.images;
            if (log.image) return [log.image];
            return [];
        };

        // 記録と写真を別々のドキュメントに保存（一覧の表示を軽くするため）
        // prevCount: 保存前の写真の枚数（減った分の写真を消すため）
        // ※ オフラインだとサーバー応答を待つとずっと終わらないので、呼び出し側では await しない
        const saveLog = (uid, log, prevCount = 0) => {
            const { images, image, imageCount, ...rest } = log;
            const id = String(log.id);
            const imgs = imagesOf(log);

            const first = db.batch();
            first.set(logsCol(uid).doc(id), { ...rest, id, imageCount: imgs.length });
            first.delete(imagesCol(uid).doc(id)); // 旧形式の写真は片付ける
            for (let i = imgs.length; i < prevCount; i++) first.delete(photosCol(uid).doc(photoId(id, i)));
            const batches = [first];
            imgs.forEach((data, i) => {
                if (i > 0 && i % PHOTOS_PER_BATCH === 0) batches.push(db.batch());
                batches[batches.length - 1].set(photosCol(uid).doc(photoId(id, i)), { logId: id, index: i, data });
            });
            return Promise.all(batches.map(b => b.commit()));
        };

        const deleteLog = (uid, id, count = 0) => {
            const batch = db.batch();
            batch.delete(logsCol(uid).doc(id));
            batch.delete(imagesCol(uid).doc(id));
            for (let i = 0; i < count; i++) batch.delete(photosCol(uid).doc(photoId(id, i)));
            return batch.commit();
        };

        const loadPhotos = async (uid, logId, count) => {
            const snap = await photosCol(uid).where('logId', '==', logId).get();
            if (!snap.empty) {
                return snap.docs.map(d => d.data())
                    .filter(p => p.index < count)
                    .sort((a, b) => a.index - b.index)
                    .map(p => p.data);
            }
            const legacy = await imagesCol(uid).doc(logId).get();
            return (legacy.exists && legacy.data().images) || [];
        };

        const reportWriteError = (err) => {
            console.error("クラウド保存失敗", err);
            alert("クラウドへの保存に失敗しました。もう一度お試しください。");
        };

        // --- 旧データ（端末内 IndexedDB）読み取り: 移行用 ---
        const DB_NAME = 'RakugoAppDB';
        const STORE_NAME = 'logs';
        const dbGetAllLocal = () => new Promise((resolve) => {
            try {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (event) => {
                    const idb = event.target.result;
                    if (!idb.objectStoreNames.contains(STORE_NAME)) idb.createObjectStore(STORE_NAME, { keyPath: 'id' });
                };
                request.onsuccess = (event) => {
                    const idb = event.target.result;
                    const req = idb.transaction([STORE_NAME], 'readonly').objectStore(STORE_NAME).getAll();
                    req.onsuccess = () => resolve(req.result || []);
                    req.onerror = () => resolve([]);
                };
                request.onerror = () => resolve([]);
            } catch (e) { resolve([]); }
        });

        const safeLocal = {
            get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },
            set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
        };

        // --- アイコン ---
        const Icon = ({ path, size = 24, className = "" }) => (

        );
        const Icons = {

            User: (p) => <Icon {...p} path='<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>' />,
            BookOpen: (p) => <Icon {...p} path='<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>' />,
            Calendar: (p) => <Icon {...p} path='<rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/>' />,
            X: (p) => <Icon {...p} path='<path d="M18 6 6 18"/><path d="m6 6 12 12"/>' />,
            Edit2: (p) => <Icon {...p} path='<path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>' />,
            Save: (p) => <Icon {...p} path='<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>' />,
            MinusCircle: (p) => <Icon {...p} path='<circle cx="12" cy="12" r="10"/><path d="M8 12h8"/>' />,
            TrendingUp: (p) => <Icon {...p} path='<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>' />,
            ChevronLeft: (p) => <Icon {...p} path='<path d="m15 18-6-6 6-6"/>' />,
            ChevronRight: (p) => <Icon {...p} path='<path d="m9 18 6-6-6-6"/>' />,
            Camera: (p) => <Icon {...p} path='<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>' />,
            Image: (p) => <Icon {...p} path='<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>' />,
            RefreshCw: (p) => <Icon {...p} path='<path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>' />,
            ArrowUpDown: (p) => <Icon {...p} path='<path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/><path d="M12 2v20"/>' />,
            GripVertical: (p) => <Icon {...p} path='<circle cx="9" cy="12" r="1"/><circle cx="9" cy="5" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="19" r="1"/>' />,
            Settings: (p) => <Icon {...p} path='<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>' />,
            Download: (p) => <Icon {...p} path='<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>' />,
            Upload: (p) => <Icon {...p} path='<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>' />,
            LogOut: (p) => <Icon {...p} path='<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>' />,
            Cloud: (p) => <Icon {...p} path='<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>' />,
        };

        // 画像圧縮関数
        const compressImage = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = document.createElement("img");
                    img.onload = () => {
                        const canvas = document.createElement("canvas");
                        const ctx = canvas.getContext("2d");
                        const MAX_WIDTH = 600;
                        const MAX_HEIGHT = 600;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                        } else {
                            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL("image/jpeg", 0.5));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        };

        // ソート関数: 日付降順 -> 作成日時降順
        const sortLogs = (logs) => {
            return logs.sort((a, b) => {
                const dateDiff = new Date(b.date) - new Date(a.date);
                if (dateDiff !== 0) return dateDiff;
                return new Date(b.createdAt) - new Date(a.createdAt);
            });
        };

        // --- フォームの見た目（入力欄とボタンを見分けやすく） ---
        const SECTION = "bg-white rounded-xl p-3 border border-gray-200 space-y-3";
        const SECTION_TITLE = "text-sm font-bold text-[#2d4059]";
        const LABEL = "text-xs font-bold text-gray-600 block mb-1";
        const INPUT = "w-full h-11 px-3 rounded-lg border border-gray-300 bg-white text-[#2c2c2c] placeholder:text-gray-400 focus:outline-none focus:border-[#2d4059] focus:ring-2 focus:ring-[#2d4059]/20";
        const SUB_BUTTON = "w-full h-11 rounded-lg bg-[#2d4059]/10 text-[#2d4059] font-bold flex items-center justify-center gap-2 active:bg-[#2d4059]/20 hover:bg-[#2d4059]/15";

        // --- 入力候補 ---
        const DEFAULT_VENUES = ['新宿末廣亭', '鈴本演芸場', '浅草演芸ホール', '池袋演芸場'];
        const byFrequency = (counts) => Array.from(counts.entries())
            .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'ja'))
            .map(([name]) => name);

        // 打った文字を含む過去の入力を、欄のすぐ下に出す（タップで確定）
        function SuggestInput({ value, onChange, candidates, placeholder, className, icon: ItemIcon }) {
            const [open, setOpen] = useState(false);
            const q = (value || '').trim();
            const matches = open && q ? candidates.filter(c => c !== q && c.includes(q)).slice(0, 5) : [];

            return (
                <div>
                    <input
                        value={value}
                        onChange={e => { onChange(e.target.value); setOpen(true); }}
                        onFocus={() => setOpen(true)}
                        onBlur={() => setTimeout(() => setOpen(false), 150)}
                        placeholder={placeholder}
                        autoComplete="off"
                        className={className}
                    />
                    {matches.length > 0 && (
                        <div className="mt-1 rounded-lg border border-gray-200 bg-white shadow-md overflow-hidden divide-y divide-gray-100">
                            {matches.map(m => (
                                <button
                                    type="button"
                                    key={m}
                                    onMouseDown={e => e.preventDefault()}
                                    onClick={() => { onChange(m); setOpen(false); }}
                                    className="w-full text-left px-3 h-11 text-sm font-bold text-[#2d4059] hover:bg-gray-50 active:bg-gray-100 flex items-center gap-2"
                                >
                                    {ItemIcon && <ItemIcon size={14} className="text-gray-400 shrink-0"/>}{m}
                                </button>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // --- ログイン画面 ---
        function LoginScreen() {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [busy, setBusy] = useState(false);

            const handleLogin = async (e) => {
                e.preventDefault();
                setError('');
                setBusy(true);
                try {
                    await auth.signInWithEmailAndPassword(email.trim(), password);
                } catch (err) {
                    console.error(err);
                    if (err.code === 'auth/network-request-failed') setError('通信できませんでした。電波の良い場所でもう一度お試しください。');
                    else if (err.code === 'auth/too-many-requests') setError('しばらく時間をおいてからお試しください。');
                    else setError('メールアドレスかパスワードが違います。');
                } finally {
                    setBusy(false);
                }
            };

            return (
                <div className="min-h-screen max-w-md mx-auto bg-[#f7f3e8] flex flex-col">
                    <header className="bg-[#2d4059] text-white p-4 shadow-md">
                        <h1 className="text-xl font-bold font-serif flex items-center gap-2">
                            <span className="bg-red-600 px-2 py-0.5 text-sm rounded-sm">寄席</span> 落語鑑賞録
                        </h1>
                    </header>
                    <form onSubmit={handleLogin} className="p-6 space-y-4 mt-8">
                        <div className="text-center mb-6">
                            <div className="text-5xl mb-3">🎭</div>
                            <p className="font-bold text-[#2d4059]">ログイン</p>
                            <p className="text-xs text-gray-500 mt-1">一度ログインすれば、次からは不要です</p>
                        </div>
                        <div>
                            <label className="text-xs font-bold text-gray-500 block mb-1">メールアドレス</label>
                            <input type="email" autoComplete="username" required value={email} onChange={e=>setEmail(e.target.value)} className="w-full h-11 p-2 rounded border border-gray-300 bg-white"/>
                        </div>
                        <div>
                            <label className="text-xs font-bold text-gray-500 block mb-1">パスワード</label>
                            <input type="password" autoComplete="current-password" required value={password} onChange={e=>setPassword(e.target.value)} className="w-full h-11 p-2 rounded border border-gray-300 bg-white"/>
                        </div>
                        {error && <p className="text-sm text-red-600 font-bold">{error}</p>}
                        <button type="submit" disabled={busy} className="w-full bg-[#2d4059] text-white font-bold py-3 rounded flex justify-center gap-2 items-center">
                            {busy ? <div className="spinner"></div> : 'ログイン'}
                        </button>
                    </form>
                </div>
            );
        }

        // --- アプリ本体 ---
        function RakugoApp({ user }) {
            const uid = user.uid;
            const [logs, setLogs] = useState([]);
            const [isLoaded, setIsLoaded] = useState(false);

            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isCalendarOpen, setIsCalendarOpen] = useState(false);
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [viewImage, setViewImage] = useState(null);
            const [calendarEmptyDate, setCalendarEmptyDate] = useState(null); // 記録のない日を押したとき
            const [pendingScrollDate, setPendingScrollDate] = useState(null); // この日の記録までスクロールしたい
            const [calendarViewDate, setCalendarViewDate] = useState(new Date());
            const [editingLog, setEditingLog] = useState(null);
            const [isProcessingImages, setIsProcessingImages] = useState(false);
            const [isLoadingImages, setIsLoadingImages] = useState(false);

            // ドラッグ中のアイテムID
            const [draggedId, setDraggedId] = useState(null);
            const [dragOverId, setDragOverId] = useState(null);

            // 入力フォーム
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [venue, setVenue] = useState('');
            const [lineup, setLineup] = useState([{ performer: '', story: '' }]);
            const [notes, setNotes] = useState('');
            const [images, setImages] = useState([]);

            const fileInputRef = useRef(null);
            const importInputRef = useRef(null);
            const openingIdRef = useRef(null);

            // クラウドの記録をリアルタイムで読み込み（オフライン時は端末のキャッシュから）
            useEffect(() => {
                const unsub = logsCol(uid).onSnapshot(
                    (snap) => {
                        setLogs(sortLogs(snap.docs.map(d => ({ ...d.data(), id: d.id }))));
                        setIsLoaded(true);
                    },
                    (err) => {
                        console.error("読み込み失敗", err);
                        setIsLoaded(true);
                        alert("記録の読み込みに失敗しました。再読み込みしてください。");
                    }
                );
                return unsub;
            }, [uid]);

            // この端末に以前の記録が残っていれば、最初の一回だけクラウドへ移す
            useEffect(() => {
                const flag = `rakugo_migrated_${uid}`;
                if (safeLocal.get(flag)) return;
                (async () => {
                    const byId = new Map();
                    try {
                        const old = safeLocal.get('rakugo_logs');
                        if (old) JSON.parse(old).forEach(l => l && l.id && byId.set(String(l.id), l));
                    } catch (e) {}
                    (await dbGetAllLocal()).forEach(l => l && l.id && byId.set(String(l.id), l));
                    byId.forEach(l => saveLog(uid, l).catch(reportWriteError));
                    safeLocal.set(flag, '1');
                    if (byId.size > 0) alert(`この端末に残っていた${byId.size}件の記録をクラウドに移しました`);
                })();
            }, [uid]);

            // 過去の記録から候補を作る（よく出てくる順）
            const performerCandidates = useMemo(() => {
                const counts = new Map();
                logs.forEach(log => {
                    const items = log.lineup && log.lineup.length ? log.lineup : [{ performer: log.performer }];
                    items.forEach(item => { const n = (item.performer || '').trim(); if (n) counts.set(n, (counts.get(n) || 0) + 1); });
                });
                return byFrequency(counts);
            }, [logs]);

            const venueCandidates = useMemo(() => {
                const counts = new Map();
                logs.forEach(log => { const v = (log.venue || '').trim(); if (v) counts.set(v, (counts.get(v) || 0) + 1); });
                const fromHistory = byFrequency(counts).slice(0, 6);
                return fromHistory.length ? fromHistory : DEFAULT_VENUES;
            }, [logs]);

            const stats = useMemo(() => {
                const now = new Date();
                const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                const currentYear = today.getFullYear();
                const currentMonth = today.getMonth();
                const day = today.getDay();
                const diff = day === 0 ? 6 : day - 1;
                const startOfWeek = new Date(today);
                startOfWeek.setDate(today.getDate() - diff);
                const endOfWeek = new Date(startOfWeek);
                endOfWeek.setDate(startOfWeek.getDate() + 7);

                let week = 0, month = 0;
                logs.forEach(log => {
                    if (!log.date) return;
                    const [y, m, dt] = log.date.split('-').map(Number);
                    const logDate = new Date(y, m-1, dt);
                    if (logDate.getFullYear() === currentYear && logDate.getMonth() === currentMonth) month++;
                    if (logDate >= startOfWeek && logDate < endOfWeek) week++;
                });
                return { week, month };
            }, [logs]);

            useEffect(() => {
                if (!pendingScrollDate) return;
                const first = logs.find(l => l.date === pendingScrollDate);
                if (!first) return; // まだ一覧に出ていない（保存直後など）→ 出たら再実行
                const el = document.getElementById(`log-${first.id}`);
                if (!el) return;
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                setPendingScrollDate(null);
            }, [pendingScrollDate, logs]);

            const toDateStr = (y, m, d) => `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const formatJa = (dateStr) => { const [y, m, d] = dateStr.split('-').map(Number); return `${y}年${m}月${d}日`; };

            const openCalendar = () => { setCalendarEmptyDate(null); setIsCalendarOpen(true); };

            const handleCalendarDayClick = (dateStr, count) => {
                if (count > 0) {
                    setIsCalendarOpen(false);
                    setPendingScrollDate(dateStr);
                } else {
                    setCalendarEmptyDate(dateStr);
                }
            };

            const openModal = (log = null, presetDate = null) => {
                if (log) {
                    setEditingLog(log);
                    setDate(log.date);
                    setVenue(log.venue || '');
                    setNotes(log.notes || '');
                    setLineup(log.lineup && log.lineup.length ? log.lineup.map(i => ({ ...i })) : [{ performer: log.performer || '', story: log.story || '' }]);
                    setImages([]);
                    openingIdRef.current = log.id;
                    if (log.imageCount > 0) {
                        // 写真は開いたときに読み込む
                        setIsLoadingImages(true);
                        loadPhotos(uid, log.id, log.imageCount)
                            .then(photos => {
                                if (openingIdRef.current !== log.id) return;
                                setImages(photos);
                            })
                            .catch(err => {
                                console.error("写真の読み込み失敗", err);
                                alert("写真を読み込めませんでした。電波の良い場所で開き直してください。");
                            })
                            .finally(() => {
                                if (openingIdRef.current === log.id) setIsLoadingImages(false);
                            });
                    } else {
                        setIsLoadingImages(false);
                    }
                } else {
                    openingIdRef.current = null;
                    setEditingLog(null);
                    setDate(presetDate || new Date().toISOString().split('T')[0]);
                    setVenue('');
                    setLineup([{ performer: '', story: '' }]);
                    setNotes('');
                    setImages([]);
                    setIsLoadingImages(false);
                }
                setIsModalOpen(true);
            };

            const closeModal = () => {
                openingIdRef.current = null;
                setIsModalOpen(false);
            };

            const handleImageSelect = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                const targetFiles = files;

                setIsProcessingImages(true);
                try {
                    const compressedFiles = await Promise.all(
                        targetFiles.map(file => compressImage(file))
                    );
                    setImages(prev => [...prev, ...compressedFiles]);
                } catch (err) {
                    console.error("画像処理失敗", err);
                    alert("画像の読み込みに失敗しました");
                } finally {
                    setIsProcessingImages(false);
                }

                e.target.value = null;
            };

            const handleRemoveImage = (index) => {
                if(confirm("この写真を削除しますか？")) {
                    setImages(images.filter((_, i) => i !== index));
                }
            };

            const handleSave = (e) => {
                e.preventDefault();
                // 写真の読み込み中に保存すると写真が消えるので止める
                if (isProcessingImages || isLoadingImages) return;
                const cleanLineup = lineup.filter(i => (i.performer || '').trim() || (i.story || '').trim());
                const finalLineup = cleanLineup.length ? cleanLineup : [{performer:'', story:''}];

                const newLog = {
                    id: editingLog ? editingLog.id : Date.now().toString(),
                    date,
                    venue,
                    lineup: finalLineup,
                    performer: finalLineup[finalLineup.length-1].performer,
                    story: finalLineup[finalLineup.length-1].story,
                    notes,
                    images: images,
                    createdAt: editingLog ? editingLog.createdAt : new Date().toISOString()
                };

                // 画面にはすぐ反映。電波がなくても端末に貯めておき、つながったら自動でクラウドへ送られる
                saveLog(uid, newLog, editingLog ? (editingLog.imageCount || 0) : 0).catch(reportWriteError);
                if (!editingLog) setPendingScrollDate(newLog.date);
                closeModal();
            };

            const handleDeleteFromModal = () => {
                if (!editingLog) return;
                if (confirm('この記録を削除しますか？\n（元に戻せません）')) {
                    deleteLog(uid, editingLog.id, editingLog.imageCount || 0).catch(err => {
                        console.error("削除失敗", err);
                        alert("削除に失敗しました");
                    });
                    closeModal();
                }
            };

            // --- ドラッグ＆ドロップ処理 ---
            const handleDragStart = (e, log) => {
                e.dataTransfer.effectAllowed = "move";
                e.dataTransfer.setData("text/plain", log.id);
                setDraggedId(log.id);
            };

            const handleDragOver = (e, log) => {
                e.preventDefault();
                if (draggedId && draggedId !== log.id && log.date === logs.find(l => l.id === draggedId)?.date) {
                    setDragOverId(log.id);
                }
            };

            const handleDragLeave = () => {
                setDragOverId(null);
            }

            const handleDrop = (e, targetLog) => {
                e.preventDefault();
                setDragOverId(null);
                const draggedLog = logs.find(l => l.id === draggedId);
                setDraggedId(null);

                if (!draggedLog || !targetLog || draggedLog.id === targetLog.id) return;
                if (draggedLog.date !== targetLog.date) return;

                // createdAt をスワップ
                const batch = db.batch();
                batch.update(logsCol(uid).doc(draggedLog.id), { createdAt: targetLog.createdAt });
                batch.update(logsCol(uid).doc(targetLog.id), { createdAt: draggedLog.createdAt });
                batch.commit().catch(err => console.error("Drop failed", err));
            };

            const handleReload = () => {
                window.location.reload();
            };

            // --- バックアップ ---
            const handleExport = async () => {
                try {
                    const imgMap = {};
                    const legacy = await imagesCol(uid).get();
                    legacy.forEach(d => { imgMap[d.id] = d.data().images || []; });
                    const photos = await photosCol(uid).get();
                    const grouped = {};
                    photos.forEach(d => { const p = d.data(); (grouped[p.logId] = grouped[p.logId] || []).push(p); });
                    Object.entries(grouped).forEach(([logId, list]) => {
                        const count = (logs.find(l => l.id === logId) || {}).imageCount || 0;
                        imgMap[logId] = list.filter(p => p.index < count).sort((a, b) => a.index - b.index).map(p => p.data);
                    });
                    const full = logs.map(l => {
                        const { imageCount, ...rest } = l;
                        const imgs = imgMap[l.id] || [];
                        return { ...rest, images: imgs, image: imgs[0] || null };
                    });
                    const blob = new Blob([JSON.stringify(full)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `rakugo-backup-${new Date().toISOString().slice(0, 10)}.json`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                } catch (err) {
                    console.error("書き出し失敗", err);
                    alert("書き出しに失敗しました");
                }
            };

            const handleImport = async (e) => {
                const file = e.target.files[0];
                e.target.value = null;
                if (!file) return;
                try {
                    const data = JSON.parse(await file.text());
                    if (!Array.isArray(data)) throw new Error('形式が違います');
                    const valid = data.filter(l => l && l.id && l.date);
                    if (!confirm(`${valid.length}件の記録を読み込みます。同じ記録は上書きされます。よろしいですか？`)) return;
                    valid.forEach(l => {
                        const existing = logs.find(x => x.id === String(l.id));
                        saveLog(uid, l, existing ? (existing.imageCount || 0) : 0).catch(reportWriteError);
                    });
                    alert(`${valid.length}件を読み込みました`);
                    setIsSettingsOpen(false);
                } catch (err) {
                    console.error("読み込み失敗", err);
                    alert("読み込みに失敗しました。バックアップファイルを選んでください。");
                }
            };

            const handleLogout = () => {
                if (confirm('ログアウトしますか？\n（記録はクラウドに残ります）')) auth.signOut();
            };

            if (!isLoaded) {
                return <div className="min-h-screen bg-[#f7f3e8] flex items-center justify-center text-[#2c2c2c] flex-col gap-2"><div className="spinner"></div><div className="text-sm font-bold">読み込み中...</div></div>;
            }

            const imagesBusy = isProcessingImages || isLoadingImages;

            return (
                <div className="min-h-screen pb-24 max-w-md mx-auto bg-[#f7f3e8] shadow-2xl min-h-screen">
                    <header className="bg-[#2d4059] text-white p-4 sticky top-0 z-10 shadow-md">
                        <div className="flex justify-between items-center mb-3">
                            <h1 className="text-xl font-bold font-serif flex items-center gap-2">
                                <span className="bg-red-600 px-2 py-0.5 text-sm rounded-sm">寄席</span> 落語鑑賞録
                            </h1>
                            <div className="flex gap-3 items-center">
                                <div className="text-sm font-bold text-[#eecda3] flex items-center gap-1"><Icons.BookOpen size={14}/> {logs.length}席</div>
                                <button onClick={handleReload} className="text-white/70 hover:text-white" title="更新"><Icons.RefreshCw size={20}/></button>
                                <button onClick={() => setIsSettingsOpen(true)} className="text-white/70 hover:text-white" title="設定"><Icons.Settings size={20}/></button>
                            </div>
                        </div>
                        <div className="flex gap-3 text-xs">
                            <button onClick={openCalendar} className="bg-[#1e2b3c] flex-1 py-2 px-3 rounded flex justify-between items-center border border-white/10 hover:bg-[#3d4d65]">
                                <span className="text-gray-400 flex gap-1 items-center"><Icons.Calendar size={12}/> 今週</span>
                                <span className="font-bold text-lg">{stats.week}<span className="text-xs font-normal ml-0.5">席</span></span>
                            </button>
                            <button onClick={openCalendar} className="bg-[#1e2b3c] flex-1 py-2 px-3 rounded flex justify-between items-center border border-white/10 hover:bg-[#3d4d65]">
                                <span className="text-gray-400 flex gap-1 items-center"><Icons.TrendingUp size={12}/> 今月</span>
                                <span className="font-bold text-lg">{stats.month}<span className="text-xs font-normal ml-0.5">席</span></span>
                            </button>
                        </div>
                    </header>

                    <main className="p-4 space-y-4">
                        {logs.length === 0 ? (
                            <div className="text-center py-20 opacity-50">
                                <div className="text-6xl mb-4">🎭</div>
                                <p className="font-bold">まだ記録がありません</p>
                                <p className="text-sm mt-2">右下の「記録する」から<br/>最初の寄席を追加してください</p>
                            </div>
                        ) : (
                            logs.map((log) => (
                                <div
                                    key={log.id}
                                    id={`log-${log.id}`}
                                    onClick={() => openModal(log)}
                                    className={`bg-white p-4 rounded-lg shadow-sm border-l-4 border-[#c84b31] relative transition-all draggable-card cursor-pointer active:bg-gray-50 scroll-mt-32
                                        hover:shadow-md
                                        ${dragOverId === log.id ? 'drag-target' : ''}
                                        ${draggedId === log.id ? 'opacity-30' : ''}
                                    `}
                                    draggable={true}
                                    onDragStart={(e) => handleDragStart(e, log)}
                                    onDragOver={(e) => handleDragOver(e, log)}
                                    onDragLeave={handleDragLeave}
                                    onDrop={(e) => handleDrop(e, log)}
                                >
                                    <Icons.ChevronRight size={20} className="absolute top-1/2 -translate-y-1/2 right-3 text-gray-300"/>

                                    <div className="text-xs text-gray-500 mb-2 font-mono flex items-center gap-2 pr-6">
                                        <span className="flex items-center gap-1"><Icons.Calendar size={12}/> {(log.date || '').replace(/-/g, '.')}</span>
                                        <span className="text-gray-300">|</span>
                                        <span className="flex items-center gap-1"><Icons.MapPin size={12}/> {log.venue || '未定'}</span>
                                        {log.imageCount > 0 && <span className="text-gray-400 ml-auto flex items-center gap-1"><Icons.Image size={14}/> {log.imageCount > 1 ? log.imageCount : ''}</span>}
                                    </div>
                                    <div className="space-y-2 mb-2 pr-6">
                                        {(log.lineup && log.lineup.length ? log.lineup : [{performer: log.performer, story: log.story}]).map((item, idx) => (
                                            <div key={idx}>
                                                <h3 className="text-lg font-bold text-[#2d4059]">{item.story || '演目なし'}</h3>
                                                <div className="text-[#c84b31] text-sm font-bold flex items-center gap-1"><Icons.User size={14}/> {item.performer || '演者なし'}</div>
                                            </div>
                                        ))}
                                    </div>
                                    {log.notes && <div className="mr-6 bg-[#fcfaf5] p-2 text-sm text-gray-600 rounded border border-[#eecda3]/30">{log.notes}</div>}
                                </div>
                            ))
                        )}
                    </main>

                    <button onClick={() => openModal()} className="fixed bottom-6 right-6 bg-[#c84b31] text-white h-14 pl-4 pr-5 rounded-full shadow-lg active:scale-95 transition-transform z-20 flex items-center gap-1 font-bold"><Icons.Plus size={24}/> 記録する</button>

                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                            <div className="bg-[#f7f3e8] w-full max-w-md rounded-xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                                <div className="bg-[#2d4059] text-white px-4 py-3 flex justify-between items-center">
                                    <h2 className="font-bold flex gap-2 items-center">{editingLog ? <Icons.Edit2 size={18}/> : <Icons.BookOpen size={18}/>} {editingLog ? '記録を編集' : '新しい記録'}</h2>
                                    <button type="button" onClick={closeModal} aria-label="閉じる" className="w-10 h-10 -mr-2 rounded-full flex items-center justify-center hover:bg-white/10"><Icons.X size={22}/></button>
                                </div>
                                <form onSubmit={handleSave} className="p-3 overflow-y-auto flex-1 space-y-3">
                                    {/* いつ・どこで */}
                                    <section className={SECTION}>
                                        <h3 className={SECTION_TITLE}>いつ・どこで</h3>
                                        <div>
                                            <label className={LABEL}>日付</label>
                                            <input type="date" required value={date} onChange={e=>setDate(e.target.value)} className={INPUT}/>
                                        </div>
                                        <div>
                                            <label className={LABEL}>場所</label>
                                            <input type="text" value={venue} onChange={e=>setVenue(e.target.value)} placeholder="寄席の名前" autoComplete="off" className={INPUT}/>
                                            <div className="flex flex-wrap gap-2 mt-2">
                                                {venueCandidates.map(v => (
                                                    <button
                                                        type="button"
                                                        key={v}
                                                        onClick={() => setVenue(v)}
                                                        className={`h-9 px-3 rounded-full text-sm font-bold border transition-colors ${venue === v ? 'bg-[#2d4059] text-white border-[#2d4059]' : 'bg-white text-[#2d4059] border-[#2d4059]/30 active:bg-[#2d4059]/10'}`}
                                                    >{v}</button>
                                                ))}
                                            </div>
                                        </div>
                                    </section>

                                    {/* 出演 */}
                                    <section className={SECTION}>
                                        <div className="flex justify-between items-baseline">
                                            <h3 className={SECTION_TITLE}>出演</h3>
                                            <span className="text-xs text-gray-500">出てきた順に</span>
                                        </div>
                                        {lineup.map((item, idx) => (
                                            <div key={idx} className={`flex gap-2 items-start ${idx > 0 ? 'pt-3 border-t border-gray-100' : ''}`}>
                                                <div className="w-7 h-7 mt-2 shrink-0 rounded-full bg-[#2d4059] text-white text-xs font-bold flex items-center justify-center">{idx+1}</div>
                                                <div className="flex-1 space-y-2">
                                                    <SuggestInput placeholder="演者" value={item.performer} candidates={performerCandidates} icon={Icons.User} onChange={v=>{setLineup(prev=>prev.map((it,i)=>i===idx?{...it,performer:v}:it))}} className={`${INPUT} font-bold`}/>
                                                    <input placeholder="演目" value={item.story} onChange={e=>{const n=[...lineup];n[idx]={...n[idx],story:e.target.value};setLineup(n)}} className={INPUT}/>
                                                </div>
                                                {lineup.length>1 && (
                                                    <button type="button" aria-label={`${idx+1}番目を削除`} onClick={()=>{ if ((item.performer||item.story) && !confirm('この出演者を削除しますか？')) return; setLineup(lineup.filter((_,i)=>i!==idx)); }} className="w-9 h-9 mt-1 shrink-0 rounded-full text-gray-400 hover:bg-red-50 hover:text-red-600 active:bg-red-100 flex items-center justify-center"><Icons.X size={18}/></button>
                                                )}
                                            </div>
                                        ))}
                                        <button type="button" onClick={()=>setLineup([...lineup,{performer:'',story:''}])} className={SUB_BUTTON}><Icons.Plus size={18}/> 出演者を追加</button>
                                    </section>

                                    {/* メモ */}
                                    <section className={SECTION}>
                                        <h3 className={SECTION_TITLE}>メモ</h3>
                                        <textarea rows={3} value={notes} onChange={e=>setNotes(e.target.value)} placeholder="感想など" className={`${INPUT} h-auto py-2`}/>
                                    </section>

                                    {/* 写真 */}
                                    <section className={SECTION}>
                                        <div className="flex justify-between items-baseline">
                                            <h3 className={SECTION_TITLE}>写真</h3>
                                            {images.length > 0 && <span className="text-xs text-gray-500">{images.length}枚</span>}
                                        </div>
                                        {isLoadingImages && (
                                            <div className="h-12 flex items-center justify-center gap-2 text-gray-500 text-sm"><div className="spinner"></div> 写真を読み込み中...</div>
                                        )}
                                        {images.length > 0 && (
                                            <div className="grid grid-cols-3 gap-2">
                                                {images.map((img, idx) => (
                                                    <div key={idx} className="relative aspect-square">
                                                        <img src={img} alt={`記録写真${idx+1}`} className="w-full h-full object-cover rounded-lg border border-gray-200 cursor-zoom-in" onClick={() => setViewImage(img)}/>
                                                        <button type="button" aria-label="写真を削除" onClick={() => handleRemoveImage(idx)} className="absolute top-1 right-1 w-7 h-7 bg-black/60 text-white rounded-full shadow-md flex items-center justify-center"><Icons.X size={14} /></button>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                        {!isLoadingImages && (
                                            <button type="button" onClick={() => fileInputRef.current.click()} disabled={isProcessingImages} className={SUB_BUTTON}>
                                                {isProcessingImages ? <div className="spinner"></div> : <Icons.Camera size={18} />}
                                                <span>{isProcessingImages ? '処理中...' : '写真を追加'}</span>
                                            </button>
                                        )}
                                        <input type="file" ref={fileInputRef} onChange={handleImageSelect} accept="image/*" multiple className="hidden" />
                                    </section>

                                    {editingLog && (
                                        <button type="button" onClick={handleDeleteFromModal} className="w-full py-3 text-sm font-bold text-red-600 flex items-center justify-center gap-2"><Icons.Trash2 size={16}/> この記録を削除</button>
                                    )}
                                </form>
                                <div className="p-3 bg-white border-t border-gray-200">
                                    <button onClick={handleSave} disabled={imagesBusy} className={`w-full h-12 bg-[#c84b31] text-white text-base font-bold rounded-lg shadow-md active:scale-[0.98] transition-transform flex justify-center gap-2 items-center ${imagesBusy ? 'opacity-50' : ''}`}><Icons.Save size={20}/> 保存する</button>
                                </div>
                            </div>
                        </div>
                    )}
                    {isCalendarOpen && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-sm rounded-xl shadow-2xl overflow-hidden">
                                <div className="bg-[#2d4059] text-white p-4 flex justify-between items-center"><h2 className="font-bold flex gap-2 items-center"><Icons.Calendar size={18}/> 鑑賞カレンダー</h2><button onClick={() => setIsCalendarOpen(false)}><Icons.X size={20}/></button></div>
                                <div className="p-4">
                                    <div className="flex justify-between items-center mb-4"><button onClick={()=>{setCalendarEmptyDate(null);setCalendarViewDate(new Date(calendarViewDate.getFullYear(), calendarViewDate.getMonth()-1, 1))}} className="p-2 bg-gray-100 rounded-full"><Icons.ChevronLeft/></button><span className="font-bold text-lg">{calendarViewDate.getFullYear()}年 {calendarViewDate.getMonth()+1}月{(() => {
                                        // 過去の月だけ、その月に何席行ったかを表示（今月はヘッダーに出ているので出さない）
                                        const now = new Date();
                                        const isPastMonth = calendarViewDate.getFullYear() * 12 + calendarViewDate.getMonth() < now.getFullYear() * 12 + now.getMonth();
                                        if (!isPastMonth) return null;
                                        const prefix = `${calendarViewDate.getFullYear()}-${String(calendarViewDate.getMonth()+1).padStart(2,'0')}-`;
                                        const count = logs.filter(l => (l.date || '').startsWith(prefix)).length;
                                        return <span className="ml-2 text-sm text-[#c84b31]">{count}席</span>;
                                    })()}</span><button onClick={()=>{setCalendarEmptyDate(null);setCalendarViewDate(new Date(calendarViewDate.getFullYear(), calendarViewDate.getMonth()+1, 1))}} className="p-2 bg-gray-100 rounded-full"><Icons.ChevronRight/></button></div>
                                    <div className="grid grid-cols-7 text-center gap-1 mb-2 text-xs font-bold text-gray-400"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div>
                                    <div className="grid grid-cols-7 text-center gap-1">
                                        {[...Array(new Date(calendarViewDate.getFullYear(), calendarViewDate.getMonth(), 1).getDay())].map((_,i)=><div key={`p${i}`}/>)}
                                        {[...Array(new Date(calendarViewDate.getFullYear(), calendarViewDate.getMonth()+1, 0).getDate())].map((_,i)=>{
                                            const d = i+1, y = calendarViewDate.getFullYear(), m = calendarViewDate.getMonth()+1;
                                            const dateStr = toDateStr(y, m, d);
                                            const isToday = new Date().toDateString() === new Date(y, m-1, d).toDateString();
                                            const logCount = logs.filter(l => l.date === dateStr).length;
                                            const isSelected = calendarEmptyDate === dateStr;
                                            return (
                                                <button
                                                    type="button"
                                                    key={d}
                                                    onClick={() => handleCalendarDayClick(dateStr, logCount)}
                                                    className={`h-10 w-10 mx-auto relative flex flex-col items-center justify-center rounded-full
                                                        ${isToday ? 'bg-[#2d4059] text-white' : isSelected ? 'bg-gray-200' : 'active:bg-gray-100 hover:bg-gray-100'}`}
                                                >
                                                    {logCount > 0 && (
                                                        <div className="absolute top-1 left-1/2 -translate-x-1/2">
                                                            {logCount > 1 ? (
                                                                <span className="w-3.5 h-3.5 bg-red-500 text-white text-[9px] font-bold flex items-center justify-center rounded-full border border-white shadow-sm">{logCount}</span>
                                                            ) : (
                                                                <div className={`w-1.5 h-1.5 rounded-full ${isToday?'bg-red-400':'bg-[#c84b31]'}`}/>
                                                            )}
                                                        </div>
                                                    )}
                                                    <span className={`text-sm ${isToday||logCount>0?'font-bold':''} mt-2`}>{d}</span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                    {calendarEmptyDate ? (
                                        <div className="mt-4 rounded-lg bg-gray-50 border border-gray-200 p-3 text-center space-y-3">
                                            <p className="text-sm text-gray-600">{formatJa(calendarEmptyDate)}の記録はありません</p>
                                            <button
                                                type="button"
                                                onClick={() => { const d = calendarEmptyDate; setIsCalendarOpen(false); setCalendarEmptyDate(null); openModal(null, d); }}
                                                className="w-full h-11 rounded-lg bg-[#c84b31] text-white font-bold flex items-center justify-center gap-2 shadow-sm active:scale-[0.98] transition-transform"
                                            ><Icons.Plus size={18}/> この日の記録を追加</button>
                                        </div>
                                    ) : (
                                        <div className="mt-4 text-center text-xs text-gray-400"><span className="inline-block w-2 h-2 rounded-full bg-[#c84b31] mr-1"></span>鑑賞した日（数字は回数）・日付を押すとその日へ</div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {isSettingsOpen && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm" onClick={() => setIsSettingsOpen(false)}>
                            <div className="bg-white w-full max-w-sm rounded-xl shadow-2xl overflow-hidden" onClick={e => e.stopPropagation()}>
                                <div className="bg-[#2d4059] text-white p-4 flex justify-between items-center"><h2 className="font-bold flex gap-2 items-center"><Icons.Settings size={18}/> 設定</h2><button onClick={() => setIsSettingsOpen(false)}><Icons.X size={20}/></button></div>
                                <div className="p-4 space-y-3">
                                    <div className="text-xs text-gray-500 flex items-center gap-1"><Icons.Cloud size={14}/> 記録はクラウドに自動保存されています</div>
                                    <button onClick={handleExport} className="w-full py-3 rounded border border-gray-300 font-bold text-[#2d4059] flex items-center justify-center gap-2"><Icons.Download size={18}/> バックアップを書き出す</button>
                                    <button onClick={() => importInputRef.current.click()} className="w-full py-3 rounded border border-gray-300 font-bold text-[#2d4059] flex items-center justify-center gap-2"><Icons.Upload size={18}/> バックアップから読み込む</button>
                                    <input type="file" ref={importInputRef} onChange={handleImport} accept=".json,application/json" className="hidden" />
                                    <button onClick={handleLogout} className="w-full py-2 text-sm text-gray-400 flex items-center justify-center gap-2"><Icons.LogOut size={16}/> ログアウト（{user.email}）</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {viewImage && (
                        <div className="fixed inset-0 bg-black/90 z-[60] flex items-center justify-center p-4 backdrop-blur-sm" onClick={() => setViewImage(null)}>
                            <button className="absolute top-4 right-4 text-white/70 hover:text-white p-2"><Icons.X size={32} /></button>
                            <img src={viewImage} className="max-w-full max-h-full object-contain rounded shadow-2xl" onClick={(e) => e.stopPropagation()} />
                        </div>
                    )}
                </div>
            );
        }

        // --- ログイン状態で画面を切り替え ---
        function Root() {
            const [user, setUser] = useState(undefined); // undefined = 確認中
            useEffect(() => auth.onAuthStateChanged(u => setUser(u || null)), []);

            if (user === undefined) {
                return <div className="min-h-screen bg-[#f7f3e8] flex items-center justify-center text-[#2c2c2c] flex-col gap-2"><div className="spinner"></div><div className="text-sm font-bold">読み込み中...</div></div>;
            }
            if (!user) return <LoginScreen />;
            return <RakugoApp key={user.uid} user={user} />;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Root />);
    </script>
</body>
</html>
