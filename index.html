        // 画像圧縮関数
        const compressImage = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = document.createElement("img");
                    img.onload = () => {
                        const canvas = document.createElement("canvas");
                        const ctx = canvas.getContext("2d");
                        const MAX_WIDTH = 600;
                        const MAX_HEIGHT = 600;
                        let width = img.width;
                        let height = img.height;
 
                        if (width > height) {
                            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                        } else {
                            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL("image/jpeg", 0.5));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        };

            });
        };

        // --- アプリ本体 ---
        function RakugoApp({ user }) {
            const uid = user.uid;

            // クラウドの記録をリアルタイムで読み込み（オフライン時は端末のキャッシュから）
            useEffect(() => {
                const unsub = logsCol(uid).onSnapshot(
                    (snap) => {
                        setLogs(sortLogs(snap.docs.map(d => ({ ...d.data(), id: d.id }))));
                        setIsLoaded(true);
                    },
                    (err) => {
                        console.error("読み込み失敗", err);
                        setIsLoaded(true);
                        alert("記録の読み込みに失敗しました。再読み込みしてください。");
                    }
                );
                return unsub;
            }, [uid]);
 
            // この端末に以前の記録が残っていれば、最初の一回だけクラウドへ移す
            useEffect(() => {
                const flag = `rakugo_migrated_${uid}`;
                if (safeLocal.get(flag)) return;
                (async () => {
                    const byId = new Map();
                    try {
                        const old = safeLocal.get('rakugo_logs');
                        if (old) JSON.parse(old).forEach(l => l && l.id && byId.set(String(l.id), l));
                    } catch (e) {}
                    (await dbGetAllLocal()).forEach(l => l && l.id && byId.set(String(l.id), l));
                    byId.forEach(l => saveLog(uid, l).catch(reportWriteError));
                    safeLocal.set(flag, '1');
                    if (byId.size > 0) alert(`この端末に残っていた${byId.size}件の記録をクラウドに移しました`);
                })();
            }, [uid]);
 
            const uniquePerformers = useMemo(() => {
                const names = new Set();
                logs.forEach(log => {
                    if (log.lineup) log.lineup.forEach(item => { if(item.performer) names.add(item.performer); });
                    else if (log.performer) names.add(log.performer);
                });
                return Array.from(names).sort();
            }, [logs]);
 
            const uniqueVenues = useMemo(() => {
                const venues = new Set();
                logs.forEach(log => { if(log.venue) venues.add(log.venue); });
                return Array.from(venues).sort();
            }, [logs]);
 
            const stats = useMemo(() => {
                const now = new Date();
                const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                const currentYear = today.getFullYear();
                const currentMonth = today.getMonth();
                const day = today.getDay();
                const diff = day === 0 ? 6 : day - 1;
                const startOfWeek = new Date(today);
                startOfWeek.setDate(today.getDate() - diff);
                const endOfWeek = new Date(startOfWeek);
                endOfWeek.setDate(startOfWeek.getDate() + 7);
 
                let week = 0, month = 0;
                logs.forEach(log => {
                    if (!log.date) return;
                    const [y, m, dt] = log.date.split('-').map(Number);
                    const logDate = new Date(y, m-1, dt);
                    if (logDate.getFullYear() === currentYear && logDate.getMonth() === currentMonth) month++;
                    if (logDate >= startOfWeek && logDate < endOfWeek) week++;
                });
                return { week, month };
            }, [logs]);
 
            const openModal = (log = null) => {

                    setEditingLog(log);

                    setImages([]);
                    openingIdRef.current = log.id;
                    if (log.imageCount > 0) {
                        // 写真は開いたときに読み込む
                        setIsLoadingImages(true);
                        imagesCol(uid).doc(log.id).get()

                                if (openingIdRef.current !== log.id) return;
                                setImages((doc.exists && doc.data().images) || []);
                            })
                            .catch(err => {
                                console.error("写真の読み込み失敗", err);
                                alert("写真を読み込めませんでした。電波の良い場所で開き直してください。");
                            })
                            .finally(() => {
                                if (openingIdRef.current === log.id) setIsLoadingImages(false);
                            });
                    } else {
                        setIsLoadingImages(false);
                    }
                } else {
                    openingIdRef.current = null;
                    setEditingLog(null);
                    setDate(new Date().toISOString().split('T')[0]);
                    setVenue('');
                    setLineup([{ performer: '', story: '' }]);
                    setNotes('');

            };
 
            const closeModal = () => {

            };
 
            const handleImageSelect = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;
 
                const currentCount = images.length;
                const remainingSlots = 3 - currentCount;
 
                if (remainingSlots <= 0) {
                    alert("写真は既に3枚登録されています");
                    e.target.value = null;
                    return;
                }
 
                let targetFiles = files;
                if (files.length > remainingSlots) {
                    alert(`写真は最大3枚までです。${remainingSlots}枚のみ追加されます。`);
                    targetFiles = files.slice(0, remainingSlots);
                }
 
                setIsProcessingImages(true);
                try {
                    const compressedFiles = await Promise.all(
                        targetFiles.map(file => compressImage(file))
                    );
                    setImages(prev => [...prev, ...compressedFiles]);
                } catch (err) {
                    console.error("画像処理失敗", err);
                    alert("画像の読み込みに失敗しました");
                } finally {
                    setIsProcessingImages(false);
                }
 
                e.target.value = null;
            };
 
            const handleRemoveImage = (index) => {
                if(confirm("この写真を削除しますか？")) {
                    setImages(images.filter((_, i) => i !== index));
                }
            };
 
            const handleSave = (e) => {
                e.preventDefault();
                // 写真の読み込み中に保存すると写真が消えるので止める
                if (isProcessingImages || isLoadingImages) return;
                const cleanLineup = lineup.filter(i => (i.performer || '').trim() || (i.story || '').trim());
                const finalLineup = cleanLineup.length ? cleanLineup : [{performer:'', story:''}];
 
                const newLog = {
                    id: editingLog ? editingLog.id : Date.now().toString(),
                    date,
                    venue,
                    lineup: finalLineup,
                    performer: finalLineup[finalLineup.length-1].performer,
                    story: finalLineup[finalLineup.length-1].story,
                    notes,
                    images: images,
                    createdAt: editingLog ? editingLog.createdAt : new Date().toISOString()
                };
 
                // 画面にはすぐ反映。電波がなくても端末に貯めておき、つながったら自動でクラウドへ送られる
                saveLog(uid, newLog).catch(reportWriteError);
                closeModal();
            };
 
            const handleDelete = (id, e) => {
                e.stopPropagation();
                if(confirm('削除しますか？')) {
                    deleteLog(uid, id).catch(err => {
                        console.error("削除失敗", err);
                        alert("削除に失敗しました");
                    });
                }
            };
 
            // --- ドラッグ＆ドロップ処理 ---
            const handleDragStart = (e, log) => {
                e.dataTransfer.effectAllowed = "move";
                e.dataTransfer.setData("text/plain", log.id);
                setDraggedId(log.id);
            };
 
            const handleDragOver = (e, log) => {
                e.preventDefault();
                if (draggedId && draggedId !== log.id && log.date === logs.find(l => l.id === draggedId)?.date) {
                    setDragOverId(log.id);
                }
            };
 
            const handleDragLeave = () => {
                setDragOverId(null);
            }
 
            const handleDrop = (e, targetLog) => {
                e.preventDefault();
                setDragOverId(null);
                const draggedLog = logs.find(l => l.id === draggedId);
                setDraggedId(null);
 
                if (!draggedLog || !targetLog || draggedLog.id === targetLog.id) return;
                if (draggedLog.date !== targetLog.date) return;
 
                // createdAt をスワップ
                const batch = db.batch();
                batch.update(logsCol(uid).doc(draggedLog.id), { createdAt: targetLog.createdAt });
                batch.update(logsCol(uid).doc(targetLog.id), { createdAt: draggedLog.createdAt });
                batch.commit().catch(err => console.error("Drop failed", err));
            };
 
            const handleReload = () => {
                window.location.reload();
            };
 
            // --- バックアップ ---
            const handleExport = async () => {
                try {
                    const snap = await imagesCol(uid).get();
                    const imgMap = {};
                    snap.forEach(d => { imgMap[d.id] = d.data().images || []; });
                    const full = logs.map(l => {
                        const { imageCount, ...rest } = l;
                        const imgs = imgMap[l.id] || [];
                        return { ...rest, images: imgs, image: imgs[0] || null };
                    });
                    const blob = new Blob([JSON.stringify(full)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `rakugo-backup-${new Date().toISOString().slice(0, 10)}.json`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                } catch (err) {
                    console.error("書き出し失敗", err);
                    alert("書き出しに失敗しました");
                }
            };
 
            const handleImport = async (e) => {
                const file = e.target.files[0];
                e.target.value = null;
                if (!file) return;
                try {
                    const data = JSON.parse(await file.text());
                    if (!Array.isArray(data)) throw new Error('形式が違います');
                    const valid = data.filter(l => l && l.id && l.date);
                    if (!confirm(`${valid.length}件の記録を読み込みます。同じ記録は上書きされます。よろしいですか？`)) return;
                    valid.forEach(l => saveLog(uid, l).catch(reportWriteError));
                    alert(`${valid.length}件を読み込みました`);
                    setIsSettingsOpen(false);
                } catch (err) {
                    console.error("読み込み失敗", err);
                    alert("読み込みに失敗しました。バックアップファイルを選んでください。");
                }
            };
 
            const handleLogout = () => {
                if (confirm('ログアウトしますか？\n（記録はクラウドに残ります）')) auth.signOut();
            };
 
            if (!isLoaded) {
                return <div className="min-h-screen bg-[#f7f3e8] flex items-center justify-center text-[#2c2c2c] flex-col gap-2"><div className="spinner"></div><div className="text-sm font-bold">読み込み中...</div></div>;
            }
 
            const imagesBusy = isProcessingImages || isLoadingImages;
 
            return (
                <div className="min-h-screen pb-24 max-w-md mx-auto bg-[#f7f3e8] shadow-2xl min-h-screen">
                    <header className="bg-[#2d4059] text-white p-4 sticky top-0 z-10 shadow-md">
                        <div className="flex justify-between items-center mb-3">
                            <h1 className="text-xl font-bold font-serif flex items-center gap-2">
                                <span className="bg-red-600 px-2 py-0.5 text-sm rounded-sm">寄席</span> 落語鑑賞録
                            </h1>
                            <div className="flex gap-3 items-center">
                                <div className="text-sm font-bold text-[#eecda3] flex items-center gap-1"><Icons.BookOpen size={14}/> {logs.length}席</div>
                                <button onClick={handleReload} className="text-white/70 hover:text-white" title="更新"><Icons.RefreshCw size={20}/></button>
                                <button onClick={() => setIsSettingsOpen(true)} className="text-white/70 hover:text-white" title="設定"><Icons.Settings size={20}/></button>
                            </div>
                        </div>
                        <div className="flex gap-3 text-xs">
                            <button onClick={() => setIsCalendarOpen(true)} className="bg-[#1e2b3c] flex-1 py-2 px-3 rounded flex justify-between items-center border border-white/10 hover:bg-[#3d4d65]">
                                <span className="text-gray-400 flex gap-1 items-center"><Icons.Calendar size={12}/> 今週</span>
                                <span className="font-bold text-lg">{stats.week}<span className="text-xs font-normal ml-0.5">席</span></span>
                            </button>
                            <button onClick={() => setIsCalendarOpen(true)} className="bg-[#1e2b3c] flex-1 py-2 px-3 rounded flex justify-between items-center border border-white/10 hover:bg-[#3d4d65]">
                                <span className="text-gray-400 flex gap-1 items-center"><Icons.TrendingUp size={12}/> 今月</span>
                                <span className="font-bold text-lg">{stats.month}<span className="text-xs font-normal ml-0.5">席</span></span>
                            </button>
                        </div>
                    </header>
 
                    <main className="p-4 space-y-4">
                        {logs.length === 0 ? (
                            <div className="text-center py-20 opacity-50">
                                <div className="text-6xl mb-4">🎭</div>
                                <p className="font-bold">まだ記録がありません</p>
                                <p className="text-sm mt-2">右下のボタンから<br/>最初の寄席を追加してください</p>
                            </div>
                        ) : (
                            logs.map((log) => (
                                <div
                                    key={log.id}
                                    onClick={() => openModal(log)}
                                    className={`bg-white p-4 rounded-lg shadow-sm border-l-4 border-[#c84b31] relative transition-all draggable-card
                                        hover:shadow-md
                                        ${dragOverId === log.id ? 'drag-target' : ''}
                                        ${draggedId === log.id ? 'opacity-30' : ''}
                                    `}
                                    draggable={true}
                                    onDragStart={(e) => handleDragStart(e, log)}
                                    onDragOver={(e) => handleDragOver(e, log)}
                                    onDragLeave={handleDragLeave}
                                    onDrop={(e) => handleDrop(e, log)}
                                >
                                    <button onClick={(e) => handleDelete(log.id, e)} className="absolute top-2 right-2 p-2 text-red-500 hover:text-red-700 z-10"><Icons.Trash2 size={16}/></button>
 
                                    <div className="text-xs text-gray-500 mb-2 font-mono flex items-center gap-2 pr-8">
                                        <span className="flex items-center gap-1"><Icons.Calendar size={12}/> {(log.date || '').replace(/-/g, '.')}</span>
                                        <span className="text-gray-300">|</span>
                                        <span className="flex items-center gap-1"><Icons.MapPin size={12}/> {log.venue || '未定'}</span>
                                        {log.imageCount > 0 && <span className="text-gray-400 ml-auto flex items-center gap-1"><Icons.Image size={14}/> {log.imageCount > 1 ? log.imageCount : ''}</span>}
                                    </div>
                                    <div className="space-y-2 mb-2">
                                        {(log.lineup && log.lineup.length ? log.lineup : [{performer: log.performer, story: log.story}]).map((item, idx) => (
                                            <div key={idx}>
                                                <h3 className="text-lg font-bold text-[#2d4059]">{item.story || '演目なし'}</h3>
                                                <div className="text-[#c84b31] text-sm font-bold flex items-center gap-1"><Icons.User size={14}/> {item.performer || '演者なし'}</div>
                                            </div>
                                        ))}
                                    </div>
                                    {log.notes && <div className="bg-[#fcfaf5] p-2 text-sm text-gray-600 rounded border border-[#eecda3]/30">{log.notes}</div>}
                                </div>
                            ))
                        )}
                    </main>
 
                    <button onClick={() => openModal()} className="fixed bottom-6 right-6 bg-[#c84b31] text-white p-4 rounded-full shadow-lg hover:scale-105 transition-transform z-20"><Icons.Plus size={28}/></button>
 
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                            <div className="bg-[#fcfaf5] w-full max-w-md rounded-xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                                <div className="bg-[#2d4059] text-white p-4 flex justify-between items-center">
                                    <h2 className="font-bold flex gap-2 items-center">{editingLog ? <Icons.Edit2 size={18}/> : <Icons.BookOpen size={18}/>} {editingLog ? '編集' : '新規記録'}</h2>
                                    <button onClick={closeModal}><Icons.X size={20}/></button>
                                </div>
                                <form onSubmit={handleSave} className="p-4 overflow-y-auto flex-1 space-y-4">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><label className="text-xs font-bold text-gray-500 block mb-1">日付</label><input type="date" required value={date} onChange={e=>setDate(e.target.value)} className="w-full h-10 p-2 rounded border border-gray-300 bg-white"/></div>
                                        <div>
                                            <label className="text-xs font-bold text-gray-500 block mb-1">場所</label>
                                            <input type="text" list="venues" value={venue} onChange={e=>setVenue(e.target.value)} placeholder="末廣亭など" className="w-full h-10 p-2 rounded border border-gray-300"/>
                                            <datalist id="venues">{uniqueVenues.map(v=><option key={v} value={v}/>)}</datalist>
                                        </div>
                                    </div>
                                    <div className="space-y-2">
                                        <div className="flex justify-between"><label className="text-xs font-bold text-gray-500">演目・演者</label><span className="text-xs text-gray-400">上から順</span></div>
                                        <datalist id="performers">{uniquePerformers.map(p=><option key={p} value={p}/>)}</datalist>
                                        {lineup.map((item, idx) => (
                                            <div key={idx} className="flex gap-2 bg-white p-2 rounded border border-gray-200">
                                                <div className="flex-1 space-y-2">
                                                    <input placeholder="演目 (芝浜)" value={item.story} onChange={e=>{const n=[...lineup];n[idx]={...n[idx],story:e.target.value};setLineup(n)}} className="w-full p-1 border-b font-bold"/>
                                                    <input placeholder="演者" list="performers" value={item.performer} onChange={e=>{const n=[...lineup];n[idx]={...n[idx],performer:e.target.value};setLineup(n)}} className="w-full p-1 text-sm"/>
                                                </div>
                                                {lineup.length>1 && <button type="button" onClick={()=>{setLineup(lineup.filter((_,i)=>i!==idx))}} className="text-gray-300"><Icons.MinusCircle/></button>}
                                            </div>
                                        ))}
                                        <button type="button" onClick={()=>setLineup([...lineup,{performer:'',story:''}])} className="w-full py-2 border-2 border-dashed rounded text-gray-500 font-bold flex justify-center gap-2 text-sm"><Icons.Plus size={16}/> 追加</button>
                                    </div>
                                    <div><label className="text-xs font-bold text-gray-500 block mb-1">メモ</label><textarea rows={3} value={notes} onChange={e=>setNotes(e.target.value)} className="w-full p-2 rounded border border-gray-300"/></div>
                                    <div>
                                        <label className="text-xs font-bold text-gray-500 block mb-1">写真 (最大3枚)</label>
                                        <div className="space-y-2">
                                            {isLoadingImages && (
                                                <div className="h-12 flex items-center justify-center gap-2 text-gray-400 text-sm"><div className="spinner"></div> 写真を読み込み中...</div>
                                            )}
                                            {images.length > 0 && (
                                                <div className="grid grid-cols-3 gap-2 mb-2">
                                                    {images.map((img, idx) => (
                                                        <div key={idx} className="relative aspect-square group">
                                                            <img src={img} alt={`記録写真${idx+1}`} className="w-full h-full object-cover rounded border border-gray-200 cursor-zoom-in" onClick={() => setViewImage(img)}/>
                                                            <button type="button" onClick={() => handleRemoveImage(idx)} className="absolute -top-1 -right-1 bg-red-500 text-white rounded-full p-0.5 shadow-md z-10"><Icons.X size={12} /></button>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                            {!isLoadingImages && images.length < 3 && (
                                                <button type="button" onClick={() => fileInputRef.current.click()} disabled={isProcessingImages} className="w-full h-12 border-2 border-dashed border-gray-300 rounded flex items-center justify-center gap-2 text-gray-400 hover:bg-gray-50 text-sm">
                                                    {isProcessingImages ? <div className="spinner"></div> : <Icons.Camera size={18} />}
                                                    <span>{isProcessingImages ? '処理中...' : `写真を追加 ${images.length > 0 ? `(${images.length}/3)` : ''}`}</span>
                                                </button>
                                            )}
                                            <input type="file" ref={fileInputRef} onChange={handleImageSelect} accept="image/*" multiple className="hidden" />
                                        </div>
                                    </div>
                                </form>
                                <div className="p-4 bg-gray-50 border-t">
                                    <button onClick={handleSave} disabled={imagesBusy} className={`w-full bg-[#2d4059] text-white font-bold py-3 rounded flex justify-center gap-2 items-center ${imagesBusy ? 'opacity-50' : ''}`}><Icons.Save size={18}/> 保存</button>
                                </div>
                            </div>
                        </div>
                    )}
                    {isCalendarOpen && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-sm rounded-xl shadow-2xl overflow-hidden">
                                <div className="bg-[#2d4059] text-white p-4 flex justify-between items-center"><h2 className="font-bold flex gap-2 items-center"><Icons.Calendar size={18}/> 鑑賞カレンダー</h2><button onClick={() => setIsCalendarOpen(false)}><Icons.X size={20}/></button></div>
                                <div className="p-4">
                                    <div className="flex justify-between items-center mb-4"><button onClick={()=>setCalendarViewDate(new Date(calendarViewDate.getFullYear(), calendarViewDate.getMonth()-1, 1))} className="p-2 bg-gray-100 rounded-full"><Icons.ChevronLeft/></button><span className="font-bold text-lg">{calendarViewDate.getFullYear()}年 {calendarViewDate.getMonth()+1}月</span><button onClick={()=>setCalendarViewDate(new Date(calendarViewDate.getFullYear(), calendarViewDate.getMonth()+1, 1))} className="p-2 bg-gray-100 rounded-full"><Icons.ChevronRight/></button></div>
                                    <div className="grid grid-cols-7 text-center gap-1 mb-2 text-xs font-bold text-gray-400"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div>
                                    <div className="grid grid-cols-7 text-center gap-1">{[...Array(new Date(calendarViewDate.getFullYear(), calendarViewDate.getMonth(), 1).getDay())].map((_,i)=><div key={`p${i}`}/>)}{[...Array(new Date(calendarViewDate.getFullYear(), calendarViewDate.getMonth()+1, 0).getDate())].map((_,i)=>{const d=i+1,y=calendarViewDate.getFullYear(),m=calendarViewDate.getMonth()+1,isToday=new Date().toDateString()===new Date(y,m-1,d).toDateString(),logCount=logs.filter(l=>l.date===`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`).length;return(
                                        <div key={d} className={`h-10 w-10 relative flex flex-col items-center justify-center rounded-full ${isToday?'bg-[#2d4059] text-white':'hover:bg-gray-100'}`}>
                                            {logCount > 0 && (
                                                <div className="absolute top-1 left-1/2 -translate-x-1/2">
                                                    {logCount > 1 ? (
                                                        <span className="w-3.5 h-3.5 bg-red-500 text-white text-[9px] font-bold flex items-center justify-center rounded-full border border-white shadow-sm">{logCount}</span>
                                                    ) : (
                                                        <div className={`w-1.5 h-1.5 rounded-full ${isToday?'bg-red-400':'bg-[#c84b31]'}`}/>
                                                    )}
                                                </div>
                                            )}
                                            <span className={`text-sm ${isToday?'font-bold':''} mt-2`}>{d}</span>
                                        </div>
                                    )})}</div>
                                    <div className="mt-4 text-center text-xs text-gray-400"><span className="inline-block w-2 h-2 rounded-full bg-[#c84b31] mr-1"></span>鑑賞した日（数字は回数）</div>
                                </div>
                            </div>
                        </div>
                    )}
 
                    {isSettingsOpen && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm" onClick={() => setIsSettingsOpen(false)}>
                            <div className="bg-white w-full max-w-sm rounded-xl shadow-2xl overflow-hidden" onClick={e => e.stopPropagation()}>
                                <div className="bg-[#2d4059] text-white p-4 flex justify-between items-center"><h2 className="font-bold flex gap-2 items-center"><Icons.Settings size={18}/> 設定</h2><button onClick={() => setIsSettingsOpen(false)}><Icons.X size={20}/></button></div>
                                <div className="p-4 space-y-3">
                                    <div className="text-xs text-gray-500 flex items-center gap-1"><Icons.Cloud size={14}/> 記録はクラウドに自動保存されています</div>
                                    <button onClick={handleExport} className="w-full py-3 rounded border border-gray-300 font-bold text-[#2d4059] flex items-center justify-center gap-2"><Icons.Download size={18}/> バックアップを書き出す</button>
                                    <button onClick={() => importInputRef.current.click()} className="w-full py-3 rounded border border-gray-300 font-bold text-[#2d4059] flex items-center justify-center gap-2"><Icons.Upload size={18}/> バックアップから読み込む</button>
                                    <input type="file" ref={importInputRef} onChange={handleImport} accept=".json,application/json" className="hidden" />
                                    <button onClick={handleLogout} className="w-full py-2 text-sm text-gray-400 flex items-center justify-center gap-2"><Icons.LogOut size={16}/> ログアウト（{user.email}）</button>
                                </div>
                            </div>
                        </div>
                    )}
 
                    {viewImage && (
                        <div className="fixed inset-0 bg-black/90 z-[60] flex items-center justify-center p-4 backdrop-blur-sm" onClick={() => setViewImage(null)}>
                            <button className="absolute top-4 right-4 text-white/70 hover:text-white p-2"><Icons.X size={32} /></button>
                            <img src={viewImage} className="max-w-full max-h-full object-contain rounded shadow-2xl" onClick={(e) => e.stopPropagation()} />
                        </div>
                    )}
                </div>
            );
        }
 
        // --- ログイン状態で画面を切り替え ---
        function Root() {
            const [user, setUser] = useState(undefined); // undefined = 確認中
            useEffect(() => auth.onAuthStateChanged(u => setUser(u || null)), []);
 
            if (user === undefined) {
                return <div className="min-h-screen bg-[#f7f3e8] flex items-center justify-center text-[#2c2c2c] flex-col gap-2"><div className="spinner"></div><div className="text-sm font-bold">読み込み中...</div></div>;
            }
            if (!user) return <LoginScreen />;
            return <RakugoApp key={user.uid} user={user} />;
        }
 
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Root />);
    </script>
</body>
</html>
